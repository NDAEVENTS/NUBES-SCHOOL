<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: public web = editorial long page; portal (alumna) and panel (Nubes) = side menu + sheets. */
:root{
  --paper:#F3F3F5; --sheet:#FFFFFF; --ink:#22232B; --muted:#6B6D78; --line:#DEDFE4; --field:#FAFAFB;
  --rose:#8E5A5E; --rose-soft:#F2E8E8; --sky:#4F6A82; --sky-soft:#E6ECF2; --done:#3F6F57; --due:#A0503F; --wait:#9A7A3E;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Century Gothic","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15161B; --sheet:#1D1E25; --ink:#ECECF0; --muted:#A0A2AD; --line:#30323B; --field:#18191F;
  --rose:#D9A2A6; --rose-soft:#2E2326; --sky:#9DB7CF; --sky-soft:#212A33; --done:#8CC2A4; --due:#E39A89; --wait:#D6B675; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15161B; --sheet:#1D1E25; --ink:#ECECF0; --muted:#A0A2AD; --line:#30323B; --field:#18191F;
  --rose:#D9A2A6; --rose-soft:#2E2326; --sky:#9DB7CF; --sky-soft:#212A33; --done:#8CC2A4; --due:#E39A89; --wait:#D6B675; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:300;font-size:15px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.12}
p{margin:0}
a{color:var(--rose)}
button{font:inherit;color:inherit;cursor:pointer}
:is(button,input,select,textarea,a,summary):focus-visible{outline:2px solid var(--sky);outline-offset:2px}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
.num{font-variant-numeric:tabular-nums lining-nums}
.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400}
.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose);font-weight:400}
.hint{font-size:13px;color:var(--muted)}
.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--sheet);padding:8px 16px;border-radius:999px;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--rose)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.next .btn{color:var(--ink)}
.btn.primary:hover{background:var(--rose);border-color:var(--rose)}
.btn.sm{padding:4px 12px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;font-weight:400}
.pill.done{color:var(--done)} .pill.wait{color:var(--wait)} .pill.prog{color:var(--sky)} .pill.up{color:var(--muted)} .pill.due{color:var(--due)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px}
.pad{padding:22px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.bar{height:5px;background:var(--sky-soft);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* Demo bar */
.demo-bar{background:var(--rose-soft);font-size:12.5px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.demo-bar button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 12px;font-size:12.5px}
.demo-bar button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Public web */
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--display);font-weight:400;font-size:21px}
.brand span{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--rose)}
.nav nav{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:14px}
.nav nav a{color:var(--ink);text-decoration:none}
.nav nav a:hover{color:var(--rose)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,5vw,64px);padding-block:clamp(24px,5vw,56px) 48px;align-items:center}
.hero h1{font-size:clamp(34px,4.8vw,60px);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--rose)}
.hero p.lede{font-size:18px;max-width:46ch;color:var(--muted);margin-top:18px}
.hero .cta{margin-top:26px}
.heroimg{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;display:block;box-shadow:0 30px 60px -30px rgba(34,35,43,.35)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:220px;gap:12px}
.gallery img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block}
.gallery img:nth-child(1){grid-row:span 2}
.gallery img:nth-child(4),.gallery img:nth-child(6){grid-column:span 2}
.guidecopy{display:flex;gap:22px;align-items:center}
.gcover{width:132px;flex:none;border-radius:6px;box-shadow:0 18px 40px -18px rgba(34,35,43,.45);transform:rotate(-3deg)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;border-top:1px solid var(--ink);padding-block:22px 40px}
.facts div{display:flex;flex-direction:column;gap:6px}
.facts b{font-family:var(--display);font-weight:400;font-size:clamp(34px,4vw,46px);color:var(--rose);line-height:1}
.facts .plus{font-family:var(--body,inherit);font-style:normal;font-weight:300;font-size:.7em;vertical-align:.12em}
.facts span{color:var(--muted);font-size:14px;max-width:34ch}
.sec{padding-block:56px;display:flex;flex-direction:column;gap:26px;border-top:1px solid var(--line)}
.sec h2{font-size:clamp(28px,3.6vw,42px)}
.sec .intro{max-width:62ch;color:var(--muted)}
.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.who div{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--rose);padding-top:14px}
.who b{font-family:var(--display);font-weight:400;font-size:21px}
.who span{color:var(--muted);font-size:14.5px}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:14px;background:var(--sheet);overflow:hidden}
.stage{padding:22px;display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--line);min-width:0}
.stage:first-child{border-left:0}
.stage .wk{font-size:12px;color:var(--muted)}
.stage h3{font-size:22px}
.stage ul{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
details.mod{border-bottom:1px solid var(--line);padding:14px 0}
details.mod summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
details.mod summary::-webkit-details-marker{display:none}
details.mod summary b{font-family:var(--display);font-weight:400;font-size:20px}
details.mod ul{margin:10px 0 0;padding-left:18px;color:var(--muted);columns:2;column-gap:32px;font-size:14px}
.about{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,56px);align-items:center}
.portrait{aspect-ratio:4/5;max-width:100%;border-radius:14px;background:linear-gradient(170deg,var(--rose-soft),var(--sky-soft));display:flex;align-items:flex-end;padding:18px;color:var(--muted);font-size:13px}
img.portrait{width:100%;object-fit:cover;padding:0;display:block}
.about blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(22px,2.6vw,30px);line-height:1.25}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.plan{display:flex;flex-direction:column;gap:12px;padding:24px}
.plan.star{border-color:var(--ink);box-shadow:0 1px 0 var(--ink)}
.plan h3{font-size:24px}
.plan .for{font-size:14px;font-style:italic;color:var(--muted);margin:0}
.plan .price{font-family:var(--display);font-size:40px;line-height:1}
.plan .price small{font-family:var(--body);font-size:13px;color:var(--muted)}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px;flex:1}
.plan .tag{align-self:flex-start}
.lead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;padding:30px;background:var(--sky-soft);border-radius:14px}
.lead h2{font-size:clamp(24px,3vw,34px)}
.lead form{display:flex;flex-direction:column;gap:10px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{width:auto;margin-top:4px}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{cursor:pointer;font-weight:400}
.faq p{color:var(--muted);margin-top:8px;max-width:70ch}
footer.pub{padding-block:36px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.note-demo{border:1px dashed var(--wait);color:var(--wait);border-radius:10px;padding:10px 14px;font-size:13px}

/* Checkout */
.overlay{position:fixed;inset:0;background:rgba(20,20,26,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{width:min(440px,100%);max-height:100%;overflow:auto}

/* Portal */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 40px)}
.side{border-right:1px solid var(--line);background:var(--sheet);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.side .brand{padding:0 10px 18px}
.side button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 12px;border-radius:9px;font-size:14.5px;cursor:pointer}
.side button:hover{background:var(--paper)}
.side button[aria-current="true"]{background:var(--rose-soft);color:var(--ink)}
.side button:focus-visible{outline:2px solid var(--sky)}
.side a.sidelink{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 12px;border-radius:9px;font-size:14.5px;color:var(--ink);text-decoration:none}
.side a.sidelink:hover{background:var(--paper)}
.side a.sidelink[aria-current="true"]{background:var(--rose-soft)}
.side .brand{text-decoration:none;color:inherit}
.side .count{font-size:11px;background:var(--rose);color:var(--sheet);border-radius:999px;padding:0 7px}
.side .me{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.main{padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1000px;width:100%;margin:0 auto}
.main > header h1{font-size:clamp(28px,3.6vw,40px)}
.main > header p{color:var(--muted);margin-top:6px;max-width:62ch}
.next{background:var(--ink);color:var(--paper);border-radius:14px;padding:22px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.next .label{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.next h3{font-size:24px;margin-top:4px}
.next .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.stagebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stagebar div{display:flex;flex-direction:column;gap:6px;min-width:0}
.stagebar span{font-size:12.5px;color:var(--muted)}
.stagebar b{font-weight:400;font-size:14px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .t{display:flex;flex-direction:column;min-width:0;flex:1}
.li .t small{color:var(--muted);font-size:12.5px}
.lesson{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;width:100%}
.lesson:hover b{color:var(--rose)}
.lesson:focus-visible{outline:2px solid var(--sky)}
.lesson b{font-weight:400;flex:1}
.tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px}
.tick.on{background:var(--done);border-color:var(--done);color:var(--sheet)}
.modhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.modhead h3{font-size:22px}
.locked{opacity:.55}
.reader{max-width:66ch;display:flex;flex-direction:column;gap:14px;font-size:16.5px;line-height:1.7}
.reader h2{font-size:32px}
.media{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:linear-gradient(135deg,var(--sky-soft),var(--rose-soft));display:grid;place-items:center;color:var(--muted);font-size:14px}
.media.video{display:block;background:#000;overflow:hidden}.media.video iframe{width:100%;height:100%;border:0;display:block}
.fb{border-left:2px solid var(--rose);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.fb small{color:var(--muted)}
.hours{display:flex;gap:4px;flex-wrap:wrap}
.hours i{width:22px;height:22px;border-radius:5px;background:var(--sky-soft);display:block}
.hours i.used{background:var(--sky)}
.calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.result{font-family:var(--display);font-size:38px;line-height:1}
.tile{display:flex;flex-direction:column;gap:8px;padding:18px}
.tile h3{font-size:19px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpis div{padding:16px;display:flex;flex-direction:column;gap:2px}
.kpis b{font-family:var(--display);font-weight:400;font-size:32px}

@media (max-width:900px){
  .hero,.about,.lead{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:minmax(0,1fr);gap:16px}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:160px}
  .gallery img:nth-child(4){grid-column:span 1}
  .heroimg{aspect-ratio:4/3}
  .gcover{width:96px}
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage:nth-child(3){border-left:0}
  .stage:nth-child(n+3){border-top:1px solid var(--line)}
  .plans,.who,.grid3{grid-template-columns:minmax(0,1fr)}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .side .brand{width:100%;padding:0 0 8px}
  .side .me{display:none}
  .calc,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .stages,.stagebar,.grid2{grid-template-columns:minmax(0,1fr)}
  .stage{border-left:0!important;border-top:1px solid var(--line)}
  .stage:first-child{border-top:0}
  details.mod ul{columns:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{min-height:100vh}
.center{min-height:70vh;display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.auth{width:min(400px,100%);display:flex;flex-direction:column;gap:12px}

.err{color:var(--due);font-size:14px}
.ok{color:var(--done);font-size:14px}
.reader h3{font-size:22px;margin-top:10px}
.reader ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.reader .tut{background:var(--sky-soft);border-radius:12px;padding:16px 18px;font-size:15px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
.field{display:flex;flex-direction:column;gap:5px}

.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.legal{max-width:72ch;display:flex;flex-direction:column;gap:14px;padding-block:24px 64px}
.legal h1{font-size:clamp(30px,4vw,42px)}
.legal h2{font-size:22px;margin-top:12px}
.legal .ph{background:var(--rose-soft);border-radius:4px;padding:0 4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 13px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ctabs button.all{font-size:15px;padding:8px 18px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--paper)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
.demo-note{background:var(--rose-soft);font-size:12.5px;text-align:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:560px){.formgrid{grid-template-columns:minmax(0,1fr)}}
</style>
